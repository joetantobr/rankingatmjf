<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranking ATMJF</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#d9dde3;--ac:#e8590c;--acx:#fff;--ok:#2f9e44;--bad:#e03131;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2327;--tx:#eceff3;--mut:#9aa3ad;--bd:#343a41;--ok:#51cf66;--bad:#ff6b6b}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2327;--tx:#eceff3;--mut:#9aa3ad;--bd:#343a41;--ok:#51cf66;--bad:#ff6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0 16px;text-align:center}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.vs,.x{color:var(--mut);font-weight:700}
.sq{background:var(--card);border:2px dashed var(--bd);border-radius:16px;min-height:130px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;cursor:pointer;color:var(--tx);font:inherit;width:100%}
.sq.filled{border-style:solid;border-color:var(--t,var(--ac))}.sq small{color:var(--mut)}.sq .nm{font-weight:700;font-size:17px;word-break:break-word}.sq .rt{font-size:24px;font-weight:800;color:var(--t,var(--ac))}
.add{margin-top:16px;min-height:76px;font-weight:700}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:14px}.panel h2{font-size:15px;margin:0 0 10px;text-align:center}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);max-width:100%}
button.pri{background:var(--ac);color:var(--acx);border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;width:100%;cursor:pointer;margin-top:8px}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;width:100%;cursor:pointer;margin-top:8px}
.lnk{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.msg{margin-top:14px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--bd);text-align:center}
.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.wide{max-width:900px;max-height:90%}.sheet h3{margin:0 0 10px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;padding:8px 10px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--t);border-radius:8px;color:var(--tx);font:inherit;font-size:15px;line-height:1.2;cursor:pointer;text-align:left}.pl b{font-size:14px}.pl.arq{opacity:.5}
#pickL,#playL{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left;border-bottom:1px solid var(--bd)}th{font-size:12px;color:var(--mut)}td.n,th.n{text-align:right}
.field{display:block;margin:10px 0}.field span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}.field input{width:100%}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}
.tA{--t:#d99100}.tB{--t:#1c7ed6}.tC{--t:#2f9e44}
.badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--t);color:#fff;font-size:12px;font-weight:700;text-align:center;margin-right:8px}
.legend{font-size:13px;color:var(--mut);margin:0 0 10px}
.score2{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 8px;align-items:center;margin-bottom:12px}.cap{text-align:center;color:var(--mut);font-size:14px;margin-bottom:6px}
.sl{font-size:13px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq5{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.sq5 button{aspect-ratio:1;border:2px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-weight:700;font-size:18px;cursor:pointer;padding:0}
.sq5 button.on,.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wrow .pri{margin-top:0}
.btns{display:flex;gap:8px;margin-top:8px}.btns .sec{margin-top:0;flex:1;font-size:14px}#rankBtn{flex:2!important;font-size:16px!important}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:12px 6px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;line-height:1.25}
#addM .seg button.on{border-color:var(--t);background:var(--t)}
.sub{font-size:13px;font-weight:700;margin:14px 0 4px}
.season{text-align:center;font-size:12px;color:var(--mut);margin:-10px 0 16px}.x1{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px}
</style>
</head>
<body>
<main>
  <h1>🏓 Ranking ATMJF</h1>
  <div class="season" id="seasonLbl"></div>
  <div class="row"><button class="sq" id="s1"></button><div class="vs">X</div><button class="sq" id="s2"></button></div>
  <div style="text-align:center;margin-top:6px"><button class="lnk" id="clrBtn" hidden>✕ limpar seleção</button></div>
  <div class="panel" id="match" hidden>
    <div class="legend" id="h2h" style="text-align:center"></div>
    <div class="cap">Placar (opcional)</div>
    <div class="score2"><div class="sl" id="n1"></div><div></div><div class="sl" id="n2"></div><div class="sq5" id="sc1"></div><div class="x">x</div><div class="sq5" id="sc2"></div></div>
    <h2>Quem ganhou?</h2>
    <div class="wrow"><button class="pri" id="w1"></button><button class="pri" id="w2"></button></div>
  </div>
  <div class="msg" id="msg" hidden></div>
  <button class="sq add" id="addBtn">➕ Adicionar jogador</button>
  <div class="btns"><button class="sec" id="rankBtn">📊 Ver ranking</button><button class="sec" id="matchBtn">Visualizar Partidas</button><button class="sec" id="playBtn">Jogadores</button></div>
  <div class="hint"><span id="hint"></span> · <button class="lnk" id="admBtn">🔒 Admin</button></div>
</main>

<div class="modal" id="pickM"><div class="sheet wide"><h3 id="pickT"></h3><input id="pq" placeholder="🔍 Buscar jogador..." autocomplete="off" style="width:100%;margin-bottom:10px"><div id="pickL"></div><button class="sec" data-close>Cancelar</button></div></div>

<div class="modal" id="addM"><div class="sheet">
  <h3>Novo jogador</h3>
  <label class="field"><span>Nome</span><input id="aName" maxlength="40" autocomplete="off"></label>
  <div class="field" id="aGrpF"><span>Ranking inicial (define só a pontuação de partida)</span>
    <div class="seg" id="aGrp">
      <button class="tC" data-g="C"><b>Ranking C</b><br><small>1200 pts</small></button>
      <button class="tB" data-g="B"><b>Ranking B</b><br><small>1500 pts</small></button>
      <button class="tA" data-g="A"><b>Ranking A</b><br><small>1800 pts</small></button>
    </div></div>
  <div id="aErr" class="dn"></div>
  <button class="pri" id="aSave">Adicionar</button><button class="sec" data-close>Cancelar</button>
</div></div>

<div class="modal" id="rankM"><div class="sheet">
  <h3>Ranking geral</h3>
  <p class="legend"><span class="badge tA">A</span>1800+ <span class="badge tB">B</span>1500+ <span class="badge tC">C</span>1200+</p>
  <div id="rankL"></div><p class="legend" id="rankNote"></p>
  <button class="sec" data-exp hidden id="expPlayers">⬇️ Exportar jogadores (CSV)</button><button class="sec" data-close>Fechar</button>
</div></div>

<div class="modal" id="playM"><div class="sheet wide">
  <h3 id="playT">Jogadores</h3><div id="playL"></div><div id="playD" hidden></div>
  <button class="sec" id="playBack" hidden>← Voltar à lista</button><button class="sec" data-close>Fechar</button>
</div></div>

<div class="modal" id="matchM"><div class="sheet">
  <h3>Partidas</h3><select id="mSeas" style="width:100%;margin-bottom:10px"></select><button class="sec" id="undoBtn" style="margin:0 0 10px">↩️ Desfazer última partida</button>
  <div id="matchL"></div>
  <button class="sec" data-exp hidden id="expMatches">⬇️ Exportar partidas (CSV)</button><button class="sec" data-close>Fechar</button>
</div></div>

<div class="modal" id="admM"><div class="sheet"><div id="admB"></div><button class="sec" data-close>Fechar</button></div></div>

<div class="modal" id="seasM"><div class="sheet wide"><h3 id="seasT"></h3><div class="seg" id="seasTabs" style="grid-template-columns:1fr 1fr;margin-bottom:10px"></div><div id="seasB"></div><button class="pri" id="seasOk">🏁 Confirmar e encerrar temporada</button><button class="sec" data-close>Voltar</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const START={A:1800,B:1500,C:1200};
const DEF={id:'main',maxScore:4,margin:50,inactiveDays:0,pin:'',seasonStart:0,seasons:[]};
let S={raw:[],matches:[],settings:{...DEF}}, P=[], MV=[], D={}, sel=[null,null], sc=[null,null], pickIdx=0, histId=null, newGrp='C', db=null, dl=null, admin=false, pend=null, busy=false;
const $=id=>document.getElementById(id), op=id=>$(id).classList.contains('on');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byId=id=>P.find(p=>p.id===id), tier=p=>p.tier, games=p=>p.wins+p.losses;
const nameOf=(id,fb)=>{const q=byId(id);return q?q.name:(fb||'?')};
const fmt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')};
const vis=()=>P.filter(p=>!p.hidden);
let mSel='cur', pSel='all';
const sN=n=>((S.settings.sNames||{})[n]||'Temporada '+n);
const curS=()=>(S.settings.seasons||[]).length+1;
const seasonOf=m=>1+(S.settings.seasons||[]).filter(s=>m.at>=s.end).length;
const inSeason=(m,v)=>v==='all'||seasonOf(m)===(v==='cur'?curS():+v);
const matchView=()=>[...S.matches].sort((a,b)=>a.at-b.at).filter(m=>inSeason(m,mSel));
function seasOpts(allFirst,allLabel,sv){
  const o=(v,t)=>`<option value="${v}"${String(v)===String(sv)?' selected':''}>${t}</option>`, n=curS();
  let h=allFirst?o('all',allLabel):''; h+=o('cur',sN(n)+' (atual)'); for(let i=n-1;i>=1;i--)h+=o(i,sN(i)); return h+(allFirst?'':o('all',allLabel));
}
const ranked=()=>{const d=S.settings.inactiveDays,n=Date.now();return vis().filter(p=>games(p)>=3&&(!d||n-p.last<=d*864e5)).sort((a,b)=>b.rating-a.rating)};

/* ---- cálculo: tudo vem do histórico de partidas ---- */
const K=p=>{const g=p.tw+p.tl;return g<10?40:g<30?32:24};
function calc(w,l){const E=1/(1+Math.pow(10,(l.rating-w.rating)/400));return [Math.max(1,Math.round(K(w)*(1-E))),Math.max(1,Math.round(K(l)*(1-E)))]}
function setTier(p){const m=+S.settings.margin||0;
  if(p.tier==='C'&&p.rating>=1500)p.tier='B'; if(p.tier==='B'&&p.rating>=1800)p.tier='A';
  if(p.tier==='A'&&p.rating<1800-m)p.tier='B'; if(p.tier==='B'&&p.rating<1500-m)p.tier='C'}
function compute(){
  const M={}; S.raw.forEach(p=>M[p.id]={...p,rating:START[p.group],tier:p.group,wins:0,losses:0,tw:0,tl:0,st0:p.group,r0:START[p.group],hist:[START[p.group]],last:0});
  const ss=S.settings.seasonStart||0, AM=[...S.matches].sort((a,b)=>a.at-b.at); D={}; let crossed=false;
  const snap=()=>{Object.values(M).forEach(x=>{x.st0=x.tier;x.r0=x.rating;x.wins=0;x.losses=0});crossed=true};
  AM.forEach(m=>{const w=M[m.winner],l=M[m.loser]; if(!crossed&&m.at>=ss)snap(); if(!w||!l)return;
    const [a,b]=calc(w,l); D[m.id]=[a,b]; w.rating+=a; l.rating-=b; w.wins++; l.losses++; w.tw++; l.tl++;
    w.hist.push(w.rating); l.hist.push(l.rating); w.last=l.last=m.at; setTier(w); setTier(l)});
  if(!crossed)snap();
  MV=AM.filter(m=>m.at>=ss); P=Object.values(M);
}

/* ---- armazenamento compartilhado (Lovable Cloud) ---- */
function saveLocal(){try{localStorage.setItem('tm_players',JSON.stringify(S.raw));localStorage.setItem('tm_matches',JSON.stringify(S.matches));localStorage.setItem('tm_settings',JSON.stringify(S.settings))}catch(e){}}
const key=c=>c==='players'?'raw':'matches';
function refresh(){compute();render()}
async function put(col,o){
  if(col==='settings')S.settings=o; else{const a=S[key(col)],i=a.findIndex(x=>x.id===o.id);i>=0?a[i]=o:a.push(o)}
  if(db){try{const{error}=await db.from(col).upsert({id:o.id,data:o});if(error)throw error}catch(e){msg('⚠️ Não foi possível salvar. Verifique sua conexão.')}} else saveLocal();
  refresh();
}
async function del(col,id){
  S[key(col)]=S[key(col)].filter(x=>x.id!==id);
  if(db){try{const{error}=await db.from(col).delete().eq('id',id);if(error)throw error}catch(e){msg('⚠️ Não foi possível apagar. Verifique sua conexão.')}} else saveLocal();
  refresh();
}
async function loadAll(){
  const[p,m,st]=await Promise.all([db.from('players').select('data'),db.from('matches').select('data'),db.from('settings').select('data')]);
  if(p.error||m.error||st.error)throw(p.error||m.error||st.error);
  S.raw=p.data.map(r=>r.data); S.matches=m.data.map(r=>r.data);
  const d=st.data.find(r=>r.data&&r.data.id==='main'); S.settings={...DEF,...(d?d.data:{})};
  refresh();
}
(async()=>{
  try{S.raw=JSON.parse(localStorage.getItem('tm_players')||'[]');S.matches=JSON.parse(localStorage.getItem('tm_matches')||'[]');S.settings={...DEF,...JSON.parse(localStorage.getItem('tm_settings')||'{}')}}catch(e){}
  refresh();
  try{
    db=window.supabase.createClient('https://sbphiljvejzghtmxphpi.supabase.co','sb_publishable_4PQSjPIVrDfTqngSppT5lw_oGe-CSlQ');
    await loadAll();
    db.channel('ranking').on('postgres_changes',{event:'*',schema:'public',table:'players'},()=>loadAll()).on('postgres_changes',{event:'*',schema:'public',table:'matches'},()=>loadAll()).on('postgres_changes',{event:'*',schema:'public',table:'settings'},()=>loadAll()).subscribe();
  }catch(e){db=null}
  dl={save:({filename,data})=>{const b=new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return Promise.resolve()}};
  document.querySelectorAll('[data-exp]').forEach(b=>b.hidden=!dl);
  $('hint').textContent=db?'Dados compartilhados com quem abrir este link.':'Sem conexão — dados salvos apenas neste navegador.';
})();

/* ---- helpers de UI ---- */
function open(id){$(id).classList.add('on')} 
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('on'));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));
function msg(h){const m=$('msg');m.innerHTML=h;m.hidden=false}
function flash(b,t){const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,2500)}
function sure(b,fn){ if(b.dataset.s){delete b.dataset.s;fn();return} b.dataset.s=1; const o=b.textContent; b.textContent='Toque de novo para confirmar'; setTimeout(()=>{delete b.dataset.s;b.textContent=o},3000)}
function needAdmin(fn){ if(admin){fn();return} pend=fn; renderAdm(); open('admM') }

function render(){
  $('seasonLbl').textContent=sN(curS());
  [0,1].forEach(i=>{const p=sel[i]?byId(sel[i]):null; if(!p)sel[i]=null; const b=$('s'+(i+1));
    b.className='sq'+(p?' filled t'+tier(p):'');
    b.innerHTML=p?`<small>Jogador ${i+1} · Ranking ${tier(p)}</small><span class="nm">${esc(p.name)}</span><span class="rt">${p.rating}</span>`:`<span style="font-size:28px">＋</span><span>Selecionar<br>Jogador ${i+1}</span>`});
  const a=sel[0]&&byId(sel[0]), b=sel[1]&&byId(sel[1]); $('match').hidden=!(a&&b); $('clrBtn').hidden=!(sel[0]||sel[1]);
  if(a&&b){
    $('w1').textContent='🏆 '+a.name+' venceu'; $('w2').textContent='🏆 '+b.name+' venceu'; $('n1').textContent=a.name; $('n2').textContent=b.name; drawScore();
    const c=L=>L.filter(m=>m.winner===a.id&&m.loser===b.id).length+' x '+L.filter(m=>m.winner===b.id&&m.loser===a.id).length, [x,y]=calc(a,b), [u,v]=calc(b,a);
    $('h2h').innerHTML=`Confronto direto<br>Desde sempre: ${esc(a.name)} <b>${c(S.matches)}</b> ${esc(b.name)}<br>${esc(sN(curS()))}: ${esc(a.name)} <b>${c(MV)}</b> ${esc(b.name)}<br><br>${esc(a.name)} vence: +${x} / ${esc(b.name)} −${y}<br>${esc(b.name)} vence: +${u} / ${esc(a.name)} −${v}`;
  }
  if(op('seasM'))renderSeason(); if(op('pickM'))renderPick(); if(op('rankM'))renderRank(); if(op('matchM'))renderMatches();
  if(op('playM')&&!typing())renderPlayers(); if(op('admM')&&!typing())renderAdm();
}

/* ---- escolher jogadores ---- */
$('s1').onclick=()=>pick(0); $('s2').onclick=()=>pick(1);
$('clrBtn').onclick=()=>{sel=[null,null];sc=[null,null];render()};
function pick(i){pickIdx=i;$('pickT').textContent='Jogador '+(i+1);$('pq').value='';renderPick();open('pickM')}
$('pq').oninput=()=>renderPick();
function renderPick(){
  const other=sel[1-pickIdx], q=$('pq').value.trim().toLowerCase();
  const l=vis().filter(p=>p.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  $('pickL').innerHTML=l.length?l.map(p=>`<button class="pl t${tier(p)}" data-id="${p.id}" ${p.id===other?'disabled':''}><span>${esc(p.name)}</span><b style="color:var(--t)">${p.rating}</b></button>`).join(''):'<p style="color:var(--mut);grid-column:1/-1">Nenhum jogador encontrado.</p>';
  $('pickL').querySelectorAll('.pl').forEach(b=>b.onclick=()=>{sel[pickIdx]=b.dataset.id;sc=[null,null];$('msg').hidden=true;$('pickM').classList.remove('on');render()});
}

/* ---- novo jogador ---- */
function setGrp(g){newGrp=g;document.querySelectorAll('#aGrp button').forEach(b=>b.classList.toggle('on',b.dataset.g===g))}
document.querySelectorAll('#aGrp button').forEach(b=>b.onclick=()=>setGrp(b.dataset.g));
$('addBtn').onclick=()=>{$('aName').value='';setGrp('C');$('aGrpF').hidden=!admin;$('aErr').textContent='';open('addM');setTimeout(()=>$('aName').focus(),50)};
$('aSave').onclick=async()=>{
  const name=$('aName').value.trim(); if(!name){$('aErr').textContent='Digite o nome.';return}
  if(S.raw.some(p=>p.name.toLowerCase()===name.toLowerCase())){$('aErr').textContent='Já existe um jogador com esse nome.';return}
  await put('players',{id:uid(),name,group:admin?newGrp:'C'}); $('addM').classList.remove('on'); msg(`✅ ${esc(name)} adicionado ao Ranking ${newGrp} com ${START[newGrp]} pontos.`);
};

/* ---- placar e resultado ---- */
function drawScore(){const mx=4;[0,1].forEach(i=>{$('sc'+(i+1)).innerHTML=Array.from({length:mx+1},(_,v)=>`<button data-i="${i}" data-v="${v}" class="${sc[i]===v?'on':''}">${v}</button>`).join('')})}
['sc1','sc2'].forEach(id=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,v=+b.dataset.v;sc[i]=sc[i]===v?null:v;drawScore()}));
async function win(wi){
  if(busy)return; const w=byId(sel[wi]), l=byId(sel[1-wi]); if(!w||!l)return;
  const ws=sc[wi], ls=sc[1-wi], has=ws!==null&&ls!==null;
  if(has&&ws<=ls){msg('⚠️ O placar não bate com o vencedor escolhido.');return}
  busy=true; const t0=w.tier,t1=l.tier,r0=w.rating,r1=l.rating;
  await put('matches',{id:uid(),winner:w.id,loser:l.id,wn:w.name,ln:l.name,score:has?ws+'x'+ls:'',at:Date.now()});
  const nw=byId(w.id), nl=byId(l.id);
  msg(`<b>${esc(w.name)}</b> venceu${has?' por '+ws+'x'+ls:''}<br><span class="up">${esc(w.name)}: ${r0} → ${nw.rating} (+${nw.rating-r0})</span><br><span class="dn">${esc(l.name)}: ${r1} → ${nl.rating} (−${r1-nl.rating})</span>`
    +(t0!==nw.tier?`<br>${nw.tier<t0?'⬆️':'⬇️'} ${esc(w.name)} agora está no Ranking ${nw.tier}.`:'')+(t1!==nl.tier?`<br>${nl.tier<t1?'⬆️':'⬇️'} ${esc(l.name)} agora está no Ranking ${nl.tier}.`:''));
  sel=[null,null]; sc=[null,null]; busy=false; render();
}
$('w1').onclick=()=>win(0); $('w2').onclick=()=>win(1);

/* ---- ranking ---- */
$('rankBtn').onclick=()=>{renderRank();open('rankM')};
function goPlayer(id){histId=id;pSel='all';document.querySelectorAll('.modal.on').forEach(m=>m.classList.remove('on'));renderPlayers();open('playM')}
function renderRank(){
  const l=ranked(), pendL=vis().filter(p=>!l.includes(p)), pend=pendL.length;
  $('rankNote').innerHTML=pend?`${pend} jogador(es) fora do ranking (menos de 3 partidas${S.settings.inactiveDays?' ou inativo há mais de '+S.settings.inactiveDays+' dias':''}). <button class="sec" id="rankPendB" style="margin:6px 0 0;padding:4px 10px;font-size:13px">Mostrar</button><div id="rankPend" hidden style="margin-top:8px">${pendL.sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<button class="sec pname" data-id="${p.id}" style="margin:0 6px 6px 0;padding:4px 10px;font-size:13px">${esc(p.name)}</button>`).join('')}</div>`:'';
  if(pend){$('rankPendB').onclick=()=>{const d=$('rankPend');d.hidden=!d.hidden;$('rankPendB').textContent=d.hidden?'Mostrar':'Ocultar'};
    $('rankNote').querySelectorAll('.pname').forEach(b=>b.onclick=()=>goPlayer(b.dataset.id))}
  $('rankL').innerHTML=l.length?`<table><tr><th>#</th><th>Jogador</th><th class="n">V</th><th class="n">D</th><th class="n">Pontos</th></tr>`+l.map((p,i)=>`<tr class="t${tier(p)}"><td>${i+1}</td><td><span class="badge">${tier(p)}</span><button class="pname" data-id="${p.id}" style="background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px">${esc(p.name)}</button></td><td class="n">${p.wins}</td><td class="n">${p.losses}</td><td class="n"><b style="color:var(--t)">${p.rating}</b></td></tr>`).join('')+'</table>':'<p style="color:var(--mut)">Ninguém no ranking ainda. É preciso jogar pelo menos 3 partidas.</p>';
  $('rankL').querySelectorAll('.pname').forEach(b=>b.onclick=()=>goPlayer(b.dataset.id));
}

/* ---- partidas ---- */
$('matchBtn').onclick=()=>{mSel='cur';renderMatches();open('matchM')};
$('mSeas').onchange=()=>{mSel=$('mSeas').value;renderMatches()};
$('undoBtn').onclick=e=>{const m=MV[MV.length-1]; if(!m)return; sure(e.currentTarget,()=>del('matches',m.id))};
function renderMatches(){
  const l=matchView().reverse(), so=seasOpts(false,'Todas as temporadas',mSel); if($('mSeas').dataset.h!==so){$('mSeas').innerHTML=so;$('mSeas').dataset.h=so}
  $('undoBtn').hidden=!(mSel==='cur'&&l.length);
  $('matchL').innerHTML=l.length?`<table><tr><th>Data</th><th>Vencedor</th><th>Perdedor</th><th class="n">Placar</th>${admin?'<th></th>':''}</tr>`+l.map(m=>{const d=D[m.id]||[0,0];return `<tr><td>${fmt(m.at)}</td><td><b class="up">${esc(nameOf(m.winner,m.wn))}</b> <small>+${d[0]}</small></td><td>${esc(nameOf(m.loser,m.ln))} <small>−${d[1]}</small></td><td class="n">${m.score?esc(m.score):'–'}</td>${admin?`<td><button class="x1" data-id="${m.id}">✕</button></td>`:''}</tr>`}).join('')+'</table>':'<p style="color:var(--mut)">Nenhuma partida nesta temporada.</p>';
  $('matchL').querySelectorAll('.x1').forEach(b=>b.onclick=()=>sure(b,()=>del('matches',b.dataset.id)));
}

/* ---- jogadores + histórico ---- */
$('playBtn').onclick=()=>{histId=null;renderPlayers();open('playM')};
$('playBack').onclick=()=>{histId=null;renderPlayers()};
function chart(h){
  if(h.length<2)return''; const W=300,H=90,mn=Math.min(...h)-10,mx=Math.max(...h)+10,X=i=>4+i*(W-8)/(h.length-1),Y=v=>H-6-(v-mn)/(mx-mn)*(H-12);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px;display:block;margin:8px 0"><polyline fill="none" stroke="var(--t)" stroke-width="2" points="${h.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/><text x="4" y="10" font-size="9" fill="var(--mut)">${Math.max(...h)}</text><text x="4" y="${H-1}" font-size="9" fill="var(--mut)">${Math.min(...h)}</text></svg>`;
}
function renderPlayers(){
  const p=histId?byId(histId):null; if(!p)histId=null;
  $('playL').hidden=!!p; $('playD').hidden=!p; $('playBack').hidden=!p;
  if(!p){
    const l=(admin?P:vis()).sort((a,b)=>a.name.localeCompare(b.name)); $('playT').textContent='Jogadores ('+vis().length+')';
    $('playL').innerHTML=l.length?l.map(q=>`<button class="pl t${tier(q)} ${q.hidden?'arq':''}" data-id="${q.id}"><span>${esc(q.name)}${q.hidden?' (arquivado)':''}</span><b style="color:var(--t)">${q.rating}</b></button>`).join(''):'<p style="color:var(--mut);grid-column:1/-1">Nenhum jogador cadastrado ainda.</p>';
    $('playL').querySelectorAll('.pl').forEach(b=>b.onclick=()=>{histId=b.dataset.id;pSel='all';renderPlayers()}); return;
  }
  $('playT').textContent=p.name; const g=games(p);
  const all=S.matches.filter(m=>m.winner===p.id||m.loser===p.id).sort((a,b)=>a.at-b.at);
  let rr=START[p.group]; const ser=[rr]; all.forEach(m=>{const d=D[m.id]||[0,0]; rr+=m.winner===p.id?d[0]:-d[1]; ser.push(rr)});
  const idx=all.map((m,i)=>i).filter(i=>inSeason(all[i],pSel)), ms=idx.map(i=>all[i]).reverse(), hist=idx.length?[ser[idx[0]],...idx.map(i=>ser[i+1])]:[];
  const nw=ms.filter(m=>m.winner===p.id).length, nl=ms.length-nw;
  let h=`<div class="phead t${tier(p)}"><span class="badge">${tier(p)}</span><b style="font-size:22px;color:var(--t)">${p.rating}</b> pts · ${nw}V ${nl}D`+(pSel==='cur'&&g<3?` · <span style="color:var(--mut)">${g}/3 partidas para entrar no ranking</span>`:'')+`<div style="margin-top:8px"><select id="pS" style="width:100%">${seasOpts(true,'Geral (todas as temporadas)',pSel)}</select></div>`+chart(hist)+`</div>`;
  if(admin)h+=`<div class="wrow" style="margin-bottom:10px"><input id="rn" value="${esc(p.name)}" maxlength="40"><button class="sec" id="rnB" style="margin:0">Salvar nome</button></div><button class="sec" id="arB" style="margin:0 0 10px">${p.hidden?'♻️ Reativar jogador':'🗄️ Arquivar jogador (some das listas, histórico fica)'}</button>`;
  h+=ms.length?`<table><tr><th>Data</th><th>Adversário</th><th>Resultado</th><th class="n">Placar</th><th class="n">Pontos</th></tr>`+ms.map(m=>{const won=m.winner===p.id,d=D[m.id]||[0,0],s=m.score?(won?m.score:m.score.split('x').reverse().join('x')):'–';
    return `<tr><td>${fmt(m.at)}</td><td>${esc(won?nameOf(m.loser,m.ln):nameOf(m.winner,m.wn))}</td><td class="${won?'up':'dn'}">${won?'Vitória':'Derrota'}</td><td class="n">${esc(s)}</td><td class="n ${won?'up':'dn'}">${won?'+'+d[0]:'−'+d[1]}</td></tr>`}).join('')+'</table>':'<p style="color:var(--mut)">Nenhuma partida neste período.</p>';
  $('playD').innerHTML=h; $('pS').onchange=()=>{pSel=$('pS').value;renderPlayers()};
  if(admin){
    $('rnB').onclick=async()=>{const n=$('rn').value.trim(); if(!n)return; if(S.raw.some(x=>x.id!==p.id&&x.name.toLowerCase()===n.toLowerCase()))return flash($('rnB'),'Nome já existe'); await put('players',{...S.raw.find(x=>x.id===p.id),name:n}); flash($('rnB'),'✅ Salvo')};
    $('arB').onclick=e=>sure(e.currentTarget,()=>put('players',{...S.raw.find(x=>x.id===p.id),hidden:!p.hidden}));
  }
}

/* ---- admin (PIN), configurações, backup, temporada ---- */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tm:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
$('admBtn').onclick=()=>{pend=null;renderAdm();open('admM')};
function renderAdm(){
  const B=$('admB'), st=S.settings;
  if(!admin){
    B.innerHTML=`<h3>🔒 Modo administrador</h3><p class="legend">${st.pin?'Digite o PIN do clube.':'Nenhum PIN criado ainda. Crie um (mínimo 4 dígitos).'}</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" style="width:100%"><div id="pinErr" class="dn"></div><button class="pri" id="pinOk">${st.pin?'Entrar':'Criar PIN'}</button>`;
    $('pinOk').onclick=async()=>{const v=$('pin').value.trim(); if(v.length<4){$('pinErr').textContent='Mínimo 4 dígitos.';return}
      const h=await sha(v); if(st.pin&&h!==st.pin){$('pinErr').textContent='PIN incorreto.';return}
      if(!st.pin)await put('settings',{...S.settings,pin:h}); admin=true; const f=pend; pend=null; if(f){$('admM').classList.remove('on');f()}; render(); renderAdm()};
    return;
  }
  B.innerHTML=`<h3>⚙️ Administrador</h3>
  <label class="field"><span>Margem para trocar de faixa (pontos). Ex.: 50 = só cai do A abaixo de 1750</span><input id="mg" type="number" min="0" inputmode="numeric" value="${+st.margin||0}"></label>
  <label class="field"><span>Inativo some do ranking após (dias; 0 = nunca)</span><input id="ia" type="number" min="0" inputmode="numeric" value="${+st.inactiveDays||0}"></label>
  <div class="sub">Temporada</div><div class="wrow" style="margin-bottom:10px"><input id="snI" maxlength="40" value="${esc(sN(curS()))}"><button class="sec" id="snB" style="margin:0">Salvar nome</button></div><button class="sec" id="ns" style="margin:0">🏁 Encerrar temporada (pontos continuam)</button>
  ${(st.seasons||[]).slice().reverse().map(s=>`<details style="margin-top:8px"><summary>${esc(sN(s.n))} · ${new Date(s.end).toLocaleDateString('pt-BR')}</summary><table>${s.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r[0])}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td></tr>`).join('')}</table></details>`).join('')}
  <div class="sub">Backup</div>
  <button class="sec" id="bkE" ${dl?'':'hidden'} style="margin:0">⬇️ Baixar backup (JSON)</button>
  <input type="file" id="bkF" accept=".json,application/json" style="width:100%;margin-top:8px"><textarea id="bk" rows="3" placeholder="Cole aqui o conteúdo do backup..." style="width:100%;margin-top:8px"></textarea>
  <button class="sec" id="bkR" style="margin:0">♻️ Restaurar backup (substitui tudo)</button>
  <button class="sec" id="out">Sair do modo administrador</button>`;
  $('mg').onchange=()=>put('settings',{...S.settings,margin:Math.max(0,+$('mg').value||0)});
  $('ia').onchange=()=>put('settings',{...S.settings,inactiveDays:Math.max(0,+$('ia').value||0)});
  $('snB').onclick=async e=>{const v=$('snI').value.trim(),n=curS(),m={...(S.settings.sNames||{})};if(v)m[n]=v;else delete m[n];await put('settings',{...S.settings,sNames:m});flash(e.currentTarget,'✅ Salvo')};
  $('ns').onclick=()=>{sTab=0;renderSeason();open('seasM')};
  $('bkE').onclick=async e=>{const b=e.currentTarget;try{await dl.save({filename:'backup-ranking-'+today()+'.json',data:JSON.stringify({v:2,players:S.raw,matches:S.matches,settings:S.settings})});flash(b,'✅ Arquivo salvo')}catch(x){if(!x||x.code!=='declined')flash(b,'⚠️ Não foi possível salvar')}};
  $('bkF').onchange=async()=>{const f=$('bkF').files[0]; if(f)$('bk').value=await f.text()};
  $('bkR').onclick=e=>sure(e.currentTarget,async()=>{
    const b=$('bkR'); let d; try{d=JSON.parse($('bk').value)}catch(x){return flash(b,'⚠️ Backup inválido')}
    if(!d||!Array.isArray(d.players)||!Array.isArray(d.matches))return flash(b,'⚠️ Backup inválido');
    for(const x of S.raw.filter(x=>!d.players.some(y=>y.id===x.id)))await del('players',x.id);
    for(const x of S.matches.filter(x=>!d.matches.some(y=>y.id===x.id)))await del('matches',x.id);
    for(const x of d.players)await put('players',{id:x.id,name:x.name,group:x.group,...(x.hidden?{hidden:true}:{})});
    for(const x of d.matches)await put('matches',x);
    if(d.settings)await put('settings',{...DEF,...d.settings,id:'main'}); flash($('bkR'),'✅ Backup restaurado')});
  $('out').onclick=()=>{admin=false;render();renderAdm()};
}

/* ---- encerrar temporada: tela de conferência ---- */
let sTab=0;
function renderSeason(){
  const n=(S.settings.seasons||[]).length+1, ch=vis().filter(p=>p.st0!==p.tier).sort((a,b)=>b.rating-a.rating);
  $('seasT').textContent='Encerrar '+sN(n)+'?';
  $('seasTabs').innerHTML=`<button data-t="0" class="${sTab===0?'on':''}">Mudanças de ranking (${ch.length})</button><button data-t="1" class="${sTab===1?'on':''}">Jogos da temporada (${MV.length})</button>`;
  $('seasTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{sTab=+b.dataset.t;renderSeason()});
  $('seasB').innerHTML=sTab===0
    ?(ch.length?`<table><tr><th>Jogador</th><th>Ranking</th><th class="n">Pontos</th></tr>`+ch.map(p=>{const up=p.tier<p.st0;return `<tr class="t${p.tier}"><td>${esc(p.name)}</td><td class="${up?'up':'dn'}">${up?'⬆️':'⬇️'} ${p.st0} → ${p.tier}</td><td class="n">${p.r0} → <b style="color:var(--t)">${p.rating}</b></td></tr>`}).join('')+'</table>':'<p style="color:var(--mut)">Nenhum jogador mudou de ranking nesta temporada.</p>')+'<p class="legend" style="margin-top:10px">Os pontos de cada jogador continuam na próxima temporada.</p>'
    :(MV.length?`<table><tr><th>Data</th><th>Vencedor</th><th>Perdedor</th><th class="n">Placar</th></tr>`+[...MV].reverse().map(m=>`<tr><td>${fmt(m.at)}</td><td><b class="up">${esc(nameOf(m.winner,m.wn))}</b></td><td>${esc(nameOf(m.loser,m.ln))}</td><td class="n">${m.score?esc(m.score):'–'}</td></tr>`).join('')+'</table>':'<p style="color:var(--mut)">Nenhuma partida nesta temporada.</p>');
}
$('seasOk').onclick=e=>sure(e.currentTarget,async()=>{
  const rows=ranked().map(p=>[p.name,p.rating,tier(p),p.wins,p.losses]), ss=S.settings.seasons||[];
  await put('settings',{...S.settings,seasonStart:Date.now(),seasons:[...ss,{n:ss.length+1,end:Date.now(),rows}]});
  $('seasM').classList.remove('on');
});

/* ---- exportar CSV ---- */
const today=()=>new Date().toISOString().slice(0,10);
async function exportCsv(btn,name,rows){
  if(!dl)return; const data='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\r\n'), o=btn.textContent; let t='✅ Arquivo salvo';
  try{await dl.save({filename:name,data})}catch(e){t=(e&&e.code==='declined')?o:'⚠️ Não foi possível exportar'} btn.textContent=t; setTimeout(()=>btn.textContent=o,2500);
}
$('expPlayers').onclick=e=>{const r=ranked().map(p=>p.id);
  exportCsv(e.currentTarget,'ranking-jogadores-'+today()+'.csv',[['Posição','Jogador','Faixa','Pontos','Vitórias','Derrotas','Partidas','No ranking']].concat(vis().sort((a,b)=>b.rating-a.rating).map(p=>{const i=r.indexOf(p.id);return [i>=0?i+1:'',p.name,tier(p),p.rating,p.wins,p.losses,games(p),i>=0?'Sim':'Não']})))};
$('expMatches').onclick=e=>exportCsv(e.currentTarget,'partidas-'+today()+'.csv',[['Temporada','Data','Hora','Vencedor','Perdedor','Placar (vencedor x perdedor)','Pontos do vencedor','Pontos do perdedor']].concat(matchView().map(m=>{const d=D[m.id]||[0,0],t=new Date(m.at);return [seasonOf(m),t.toLocaleDateString('pt-BR'),t.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),nameOf(m.winner,m.wn),nameOf(m.loser,m.ln),m.score||'','+'+d[0],'-'+d[1]]})));
</script>
